<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | やさしいパソコン教室</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="container header-inner">
            <div class="site-logo">
                <span class="logo-mark">PC</span>
                <h1><a href="index.html">やさしいパソコン教室</a></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">ホーム</a></li>
                    <li><a href="access.html">アクセス</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>
        </div>

    </header>

    <main>
        <section class="page-title">
            <div class="container">
                <h2>お問い合わせ</h2>
                <p>ご質問や見学希望など、お気軽にご連絡ください。</p>
            </div>
        </section>

        <section class="contact-section">
            <div class="container">
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="name">お名前</label>
                        <input type="text" id="name" name="name" placeholder="例：山田 太郎">
                    </div>

                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" name="email" placeholder="例：sample@example.com">
                    </div>

                    <div class="form-group">
                        <label for="message">お問い合わせ内容</label>
                        <textarea id="message" name="message" rows="6" placeholder="お問い合わせ内容を入力してください"></textarea>
                    </div>

                    <button type="submit">送信する</button>

                </form>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 やさしいパソコン教室 All Rights Reserved.</p>
        </div>
    </footer>
</body>

</html>
